<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Network Error</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap');
        
        :root {
            --bg-color: #0f172a;
            --brand-blue: #3b82f6;
            --brand-light: #60a5fa;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
        }

        /* Arcade Game Canvas Container */
        .game-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin-bottom: 2rem;
            background: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        /* UFO Animation */
        .ufo {
            width: 80px;
            height: 40px;
            background: linear-gradient(to bottom, #94a3b8, #475569);
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: 40px;
            animation: float 3s ease-in-out infinite;
            z-index: 10;
            box-shadow: inset 0 4px 10px rgba(255,255,255,0.4), 0 5px 15px rgba(0,0,0,0.5);
        }

        .ufo::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 20px;
            width: 40px;
            height: 30px;
            background: rgba(96, 165, 250, 0.8);
            border-radius: 50% 50% 10% 10%;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.8);
        }

        /* Tractor Beam */
        .beam {
            position: absolute;
            top: 70px;
            width: 60px;
            height: 120px;
            background: linear-gradient(to bottom, rgba(59, 130, 246, 0.6), transparent);
            clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%);
            animation: beamPulse 2s infinite alternate, float 3s ease-in-out infinite;
            z-index: 1;
        }

        /* Wi-Fi Signal getting abducted */
        .wifi {
            position: absolute;
            bottom: 50px;
            color: #ef4444;
            animation: abduct 3s infinite;
            filter: drop-shadow(0 0 15px rgba(239, 68, 68, 0.8));
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.2rem;
            color: #f8fafc;
            margin: 0 0 16px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #3b82f6;
            line-height: 1.6;
        }

        p {
            font-size: 1rem;
            color: var(--text-muted);
            margin: 0 0 32px 0;
            max-width: 80%;
            line-height: 1.5;
        }

        .btn-refresh {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Plus Jakarta Sans', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-refresh:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px -5px rgba(37, 99, 235, 0.5);
        }

        .btn-refresh svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-refresh.loading svg {
            animation: spin 1s linear infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes beamPulse {
            0% { opacity: 0.4; filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.8)); }
            100% { opacity: 0.8; filter: drop-shadow(0 0 20px rgba(59, 130, 246, 1)); }
        }

        @keyframes abduct {
            0% { transform: translateY(0) scale(1) rotate(-10deg); opacity: 1; }
            50% { transform: translateY(-60px) scale(0.6) rotate(10deg); opacity: 0.5; color: #60a5fa;}
            100% { transform: translateY(-80px) scale(0) rotate(-10deg); opacity: 0; }
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Stars Background */
        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 8px white; }
        }
    </style>
</head>
<body>

    <div class="stars" id="starsContainer"></div>

    <div class="game-container">
        <div class="ufo"></div>
        <div class="beam"></div>
        <div class="wifi">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>
    </div>

    <h1>CONNECTION<br>LOST</h1>
    <p>The network signal has been abducted by aliens. Turn on your mobile data or Wi-Fi to rescue it!</p>

    <button class="btn-refresh" id="refreshBtn" onclick="retryConnection()">
        <svg viewBox="0 0 24 24">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        <span>RETRY</span>
    </button>

    <script>
        // Generate stars
        const starsContainer = document.getElementById('starsContainer');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 2 + 1) + 's');
            star.style.animationDelay = (Math.random() * 2) + 's';
            starsContainer.appendChild(star);
        }

        function retryConnection() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('loading');
            
            // Wait 600ms for animation, then try to load the main app URL
            setTimeout(() => {
                // By navigating to the Netlify URL, Capacitor will try to load it again.
                // If the internet is still down, it will just show this page again.
                window.location.href = 'https://bitswattend.netlify.app/';
            }, 600);
        }

        // Auto-retry when the browser detects going online
        window.addEventListener('online', () => {
            retryConnection();
        });
    </script>
</body>
</html>
