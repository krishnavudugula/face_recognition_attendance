<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>No Connection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f3f0;
            color: #1c1917;
            height: 100vh;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        /* ── Interactive Network Canvas ── */
        canvas#networkCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* ── Main Card ── */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(40px) saturate(1.6);
            -webkit-backdrop-filter: blur(40px) saturate(1.6);
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 28px;
            padding: 2.8rem 2rem 2.2rem;
            max-width: 380px;
            width: calc(100% - 2.5rem);
            text-align: center;
            box-shadow:
                0 0 0 0.5px rgba(0,0,0,0.03),
                0 1px 2px rgba(0,0,0,0.02),
                0 4px 12px rgba(0,0,0,0.04),
                0 16px 40px rgba(0,0,0,0.06);
            animation: cardIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Animated Signal Rings ── */
        .signal-visual {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signal-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid transparent;
        }

        .signal-ring:nth-child(1) {
            inset: 0;
            border-color: rgba(214, 93, 77, 0.08);
            animation: ringPulse 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .signal-ring:nth-child(2) {
            inset: 14px;
            border-color: rgba(214, 93, 77, 0.12);
            animation: ringPulse 3.5s cubic-bezier(0.4, 0, 0.2, 1) 0.35s infinite;
        }
        .signal-ring:nth-child(3) {
            inset: 28px;
            border-color: rgba(214, 93, 77, 0.18);
            animation: ringPulse 3.5s cubic-bezier(0.4, 0, 0.2, 1) 0.7s infinite;
        }

        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.4; }
        }

        /* Center icon */
        .signal-icon {
            position: relative;
            z-index: 2;
            width: 52px;
            height: 52px;
            background: linear-gradient(145deg, #e8e4df, #ffffff);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 2px 8px rgba(0,0,0,0.04),
                0 0 0 1px rgba(0,0,0,0.03),
                inset 0 1px 0 rgba(255,255,255,0.9);
        }

        .signal-icon svg {
            width: 24px;
            height: 24px;
            color: #c0614f;
            animation: iconBreath 3s ease-in-out infinite;
        }

        @keyframes iconBreath {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.92); }
        }

        /* ── Typography ── */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.68rem;
            font-weight: 700;
            color: #c0614f;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.75rem;
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both;
        }

        .badge-dot {
            width: 5px;
            height: 5px;
            background: #c0614f;
            border-radius: 50%;
            animation: blink 1.8s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #1c1917;
            letter-spacing: -0.6px;
            line-height: 1.2;
            margin-bottom: 0.5rem;
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.55s both;
        }

        .subtitle {
            font-size: 0.88rem;
            color: #8c857d;
            line-height: 1.55;
            margin-bottom: 1.8rem;
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.65s both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Retry Button with Progress Ring ── */
        .retry-wrap {
            position: relative;
            display: inline-flex;
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.75s both;
        }

        .btn-retry {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #1c1917;
            color: #fff;
            border: none;
            padding: 15px 34px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.2px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow:
                0 2px 4px rgba(28,25,23,0.06),
                0 6px 20px rgba(28,25,23,0.12);
            position: relative;
            overflow: hidden;
        }

        .btn-retry::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
            pointer-events: none;
        }

        .btn-retry:active {
            transform: scale(0.96);
        }

        .btn-retry svg.retry-icon {
            width: 17px;
            height: 17px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.4s ease;
        }

        .btn-retry.loading svg.retry-icon {
            animation: spin 0.7s linear infinite;
        }

        .btn-retry.fail {
            animation: btnShake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes btnShake {
            10%, 90% { transform: translateX(-1.5px); }
            20%, 80% { transform: translateX(2.5px); }
            30%, 50%, 70% { transform: translateX(-3px); }
            40%, 60% { transform: translateX(3px); }
        }

        /* ── Divider ── */
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,0,0,0.06), transparent);
            margin: 1.6rem 0 1.2rem;
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.85s both;
        }

        /* ── Checklist ── */
        .checklist {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.9s both;
        }

        .check-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #78716c;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(0,0,0,0.015);
            transition: background 0.2s;
        }

        .check-item:active {
            background: rgba(0,0,0,0.04);
        }

        .check-icon {
            width: 22px;
            height: 22px;
            border-radius: 7px;
            background: #f5f3f0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.7rem;
        }

        /* ── Auto-retry timer ── */
        .auto-retry-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 0 0 28px 28px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .auto-retry-bar.active {
            opacity: 1;
        }

        .auto-retry-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #c0614f, #d4856e);
            border-radius: 0 0 28px 28px;
            transition: width 0.3s linear;
        }

        /* ── Footer ── */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            text-align: center;
            z-index: 2;
        }

        .footer span {
            font-size: 0.68rem;
            color: #bbb5ad;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <canvas id="networkCanvas"></canvas>

    <div class="card">
        <div class="signal-visual">
            <div class="signal-ring"></div>
            <div class="signal-ring"></div>
            <div class="signal-ring"></div>
            <div class="signal-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                    <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                    <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                    <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
                    <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                    <line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
            </div>
        </div>

        <div class="badge">
            <span class="badge-dot"></span>
            Offline
        </div>

        <h1>You're Disconnected</h1>
        <p class="subtitle">Your device lost its connection to the network. Reconnect and tap below to pick up where you left off.</p>

        <div class="retry-wrap">
            <button class="btn-retry" id="retryBtn" onclick="retryConnection()">
                <svg class="retry-icon" viewBox="0 0 24 24">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
                Retry Connection
            </button>
        </div>

        <div class="divider"></div>

        <div class="checklist">
            <div class="check-item">
                <span class="check-icon">📶</span>
                Enable Wi-Fi or Mobile Data
            </div>
            <div class="check-item">
                <span class="check-icon">✈️</span>
                Disable Airplane Mode
            </div>
            <div class="check-item">
                <span class="check-icon">📡</span>
                Move closer to your router
            </div>
        </div>

        <div class="auto-retry-bar" id="autoRetryBar">
            <div class="auto-retry-fill" id="autoRetryFill"></div>
        </div>
    </div>

    <div class="footer">
        <span>FaceAttend</span>
    </div>

    <script>
    // ═══════════════════════════════════════════════════
    //  INTERACTIVE NETWORK MESH — Canvas Animation
    // ═══════════════════════════════════════════════════
    (function() {
        const canvas = document.getElementById('networkCanvas');
        const ctx = canvas.getContext('2d');
        let W, H, nodes = [], pointer = { x: -500, y: -500 };
        const NODE_COUNT = 55;
        const CONNECT_DIST = 140;
        const POINTER_DIST = 160;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Create nodes
        for (let i = 0; i < NODE_COUNT; i++) {
            nodes.push({
                x: Math.random() * W,
                y: Math.random() * H,
                vx: (Math.random() - 0.5) * 0.35,
                vy: (Math.random() - 0.5) * 0.35,
                r: Math.random() * 2 + 1.2,
                baseAlpha: Math.random() * 0.3 + 0.12,
                phase: Math.random() * Math.PI * 2,
                alive: true,
                flickerTimer: 0,
                flickerDuration: 0
            });
        }

        // Randomly "disconnect" nodes
        function triggerFlicker() {
            const idx = Math.floor(Math.random() * nodes.length);
            nodes[idx].flickerTimer = 0;
            nodes[idx].flickerDuration = Math.random() * 120 + 60;
            nodes[idx].alive = false;
            setTimeout(() => {
                nodes[idx].alive = true;
            }, nodes[idx].flickerDuration * 16);
        }
        setInterval(triggerFlicker, 1800);

        // Pointer tracking
        function onPointer(e) {
            const t = e.touches ? e.touches[0] : e;
            pointer.x = t.clientX;
            pointer.y = t.clientY;
        }
        window.addEventListener('mousemove', onPointer);
        window.addEventListener('touchmove', onPointer, { passive: true });
        window.addEventListener('mouseleave', () => { pointer.x = -500; pointer.y = -500; });

        function draw(time) {
            ctx.clearRect(0, 0, W, H);
            const t = time * 0.001;

            // Update & draw nodes
            for (let i = 0; i < nodes.length; i++) {
                const n = nodes[i];
                n.x += n.vx;
                n.y += n.vy;

                // Bounce
                if (n.x < 0 || n.x > W) n.vx *= -1;
                if (n.y < 0 || n.y > H) n.vy *= -1;

                // Pointer repulsion
                const pdx = n.x - pointer.x;
                const pdy = n.y - pointer.y;
                const pdist = Math.sqrt(pdx * pdx + pdy * pdy);
                if (pdist < POINTER_DIST && pdist > 0) {
                    const force = (1 - pdist / POINTER_DIST) * 0.8;
                    n.x += (pdx / pdist) * force;
                    n.y += (pdy / pdist) * force;
                }

                const alpha = n.alive
                    ? n.baseAlpha * (0.7 + 0.3 * Math.sin(t * 1.5 + n.phase))
                    : n.baseAlpha * 0.08;

                ctx.beginPath();
                ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(180, 170, 155, ${alpha})`;
                ctx.fill();
            }

            // Draw connections
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const a = nodes[i], b = nodes[j];
                    const dx = a.x - b.x, dy = a.y - b.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < CONNECT_DIST) {
                        const bothAlive = a.alive && b.alive;
                        const lineAlpha = (1 - dist / CONNECT_DIST) * (bothAlive ? 0.08 : 0.015);

                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.strokeStyle = bothAlive
                            ? `rgba(170, 160, 145, ${lineAlpha})`
                            : `rgba(195, 95, 80, ${lineAlpha * 2.5})`;
                        ctx.lineWidth = bothAlive ? 1 : 0.6;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
    })();

    // ═══════════════════════════════════════════════════
    //  RETRY LOGIC
    // ═══════════════════════════════════════════════════
    let autoRetryInterval = null;

    function getReturnUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('returnTo');
    }

    function navigateBack() {
        const returnTo = getReturnUrl();
        if (returnTo) {
            window.location.replace(returnTo);
        } else {
            window.history.back();
        }
    }

    function retryConnection() {
        const btn = document.getElementById('retryBtn');
        if (btn.classList.contains('loading')) return;
        btn.classList.add('loading');

        setTimeout(() => {
            if (navigator.onLine) {
                navigateBack();
            } else {
                btn.classList.remove('loading');
                btn.classList.add('fail');
                setTimeout(() => btn.classList.remove('fail'), 550);
            }
        }, 900);
    }

    // Auto-retry ONLY when browser detects connectivity restored
    window.addEventListener('online', () => {
        navigateBack();
    });

    // Periodic auto-retry every 15s — only if actually offline
    function startAutoRetry() {
        if (navigator.onLine) return; // Don't start if already online

        const bar = document.getElementById('autoRetryBar');
        const fill = document.getElementById('autoRetryFill');
        bar.classList.add('active');

        let progress = 0;
        const DURATION = 15000;
        const STEP = 200;

        autoRetryInterval = setInterval(() => {
            if (navigator.onLine) {
                clearInterval(autoRetryInterval);
                navigateBack();
                return;
            }
            progress += STEP;
            fill.style.width = (progress / DURATION * 100) + '%';

            if (progress >= DURATION) {
                progress = 0;
                fill.style.width = '0%';
                retryConnection();
            }
        }, STEP);
    }

    setTimeout(startAutoRetry, 2000);
    </script>
</body>
</html>
