<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Biometric Verification - FaceAttend</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/new-features.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="../js/config.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9; /* Slate 100 */
            color: #0f172a; /* Slate 900 */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.025);
            overflow: hidden;
            border: 1px solid #e2e8f0; /* Slate 200 */
            display: flex;
            flex-direction: column;
        }

        .auth-header {
            padding: 2rem 2rem 1rem;
            text-align: center;
        }

        .auth-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        .auth-header p {
            font-size: 0.95rem;
            color: #64748b; /* Slate 500 */
            line-height: 1.5;
        }

        .camera-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1; /* Square camera */
            background: #f8fafc; /* Slate 50 */
            display: flex;
            align-items: center;
            justify-content: center;
            border-top: 1px solid #f1f5f9;
            border-bottom: 1px solid #f1f5f9;
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        /* Structural Frame - Precise, non-glowing */
        .camera-frame {
            position: absolute;
            width: 240px;
            height: 280px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            pointer-events: none;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.4); /* Dim outside */
        }
        
        .camera-frame::before, .camera-frame::after,
        .camera-frame span::before, .camera-frame span::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #3b82f6; /* Blue 500 */
            border-style: solid;
            border-width: 0;
        }

        /* Top Left */
        .camera-frame::before {
            top: -2px; left: -2px;
            border-top-width: 4px;
            border-left-width: 4px;
            border-top-left-radius: 16px;
        }
        /* Top Right */
        .camera-frame::after {
            top: -2px; right: -2px;
            border-top-width: 4px;
            border-right-width: 4px;
            border-top-right-radius: 16px;
        }
        /* Bottom Left */
        .camera-frame span::before {
            bottom: -2px; left: -2px;
            border-bottom-width: 4px;
            border-left-width: 4px;
            border-bottom-left-radius: 16px;
        }
        /* Bottom Right */
        .camera-frame span::after {
            bottom: -2px; right: -2px;
            border-bottom-width: 4px;
            border-right-width: 4px;
            border-bottom-right-radius: 16px;
        }

        .auth-footer {
            padding: 1.5rem 2rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            width: 100%;
            padding: 0.875rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background-color: #2563eb; /* Blue 600 */
            color: #ffffff;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #1d4ed8; /* Blue 700 */
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: transparent;
            color: #64748b;
            border: 1px solid #cbd5e1;
        }

        .btn-secondary:hover {
            background-color: #f8fafc;
            color: #0f172a;
        }

        .status-message {
            text-align: center;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.75rem;
            border-radius: 8px;
            display: none;
        }

        .status-error {
            background-color: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .status-success {
            background-color: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
        }

        .requirements-list {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 0.5rem;
        }

        .requirements-list span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        
        .requirements-list i {
            color: #94a3b8;
        }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            .auth-container {
                border-radius: 0;
                border: none;
                min-height: 100vh;
                max-width: 100%;
            }

            .camera-wrapper {
                flex: 1; /* Fill available space */
                aspect-ratio: auto;
            }

            .auth-header {
                padding: 1.5rem 1rem 1rem;
            }

            .auth-footer {
                padding: 1rem 1.5rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <h1>Biometric Verification</h1>
            <p>Position your face inside the frame for a high-quality capture.</p>
        </div>

        <div class="camera-wrapper">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas" style="display: none;"></canvas>
            <div class="camera-frame"><span></span></div>
        </div>

        <div class="auth-footer">
            <div id="statusMessage" class="status-message"></div>
            
            <button id="captureBtn" class="btn btn-primary">
                <i class="fa-solid fa-camera"></i> Scan & Verify Face
            </button>
            <button id="retryBtn" class="btn btn-secondary" style="display: none;">
                <i class="fa-solid fa-rotate-right"></i> Try Again
            </button>

            <div class="requirements-list">
                <span><i class="fa-solid fa-sun"></i> Good lighting</span>
                <span><i class="fa-solid fa-eye"></i> Look straight</span>
                <span><i class="fa-solid fa-glasses"></i> No accessories</span>
            </div>
        </div>
    </div>

    <script>
        let video, canvas, ctx;
        let userData = null;
        let isProcessing = false;

        document.addEventListener('DOMContentLoaded', () => {
            userData = JSON.parse(sessionStorage.getItem('user_for_face_registration') || localStorage.getItem('pending_face_user') || 'null');
            
            if (!userData) {
                alert('Session expired. Please login again.');
                window.location.href = 'login.html';
                return;
            }

            video = document.getElementById('video');
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');

            initializeCamera();

            document.getElementById('captureBtn').addEventListener('click', handleCapture);
            document.getElementById('retryBtn').addEventListener('click', resetUI);
        });

        async function initializeCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false 
                });
                
                video.srcObject = stream;
                
                video.onloadedmetadata = async () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    await video.play().catch(e => console.error(e));
                };
            } catch (err) {
                showStatus('Camera access denied. Please enable camera permissions.', 'error');
                document.getElementById('captureBtn').disabled = true;
            }
        }

        async function handleCapture() {
            if (isProcessing) return;
            isProcessing = true;

            const captureBtn = document.getElementById('captureBtn');
            const retryBtn = document.getElementById('retryBtn');
            const statusMsg = document.getElementById('statusMessage');

            // UI Loading state
            captureBtn.disabled = true;
            captureBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Analyzing biometrics...';
            statusMsg.style.display = 'none';
            retryBtn.style.display = 'none';

            try {
                // Ensure canvas size
                if (canvas.width === 0) {
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                }

                // Draw and grab frame
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = canvas.toDataURL('image/jpeg', 0.9);

                // Pause video to show captured frame
                video.pause();

                // Send to backend
                const response = await fetch('/api/register_face_single', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userData.user_id,
                        face_image: imageData
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Success
                    showStatus(data.message, 'success');
                    captureBtn.style.display = 'none';
                    
                    // Cleanup pending storage
                    sessionStorage.removeItem('user_for_face_registration');
                    localStorage.removeItem('pending_face_user');
                    localStorage.removeItem('pending_face_registration');
                    
                    // Set final auth tokens
                    localStorage.setItem('user', JSON.stringify(userData));
                    localStorage.setItem('user_role', userData.role);
                    localStorage.setItem('user_id', userData.user_id);
                    localStorage.setItem('user_name', userData.name);
                    
                    // Redirect after short delay
                    setTimeout(() => {
                        window.location.href = 'faculty_dashboard.html';
                    }, 1500);
                } else {
                    // Verification Failed
                    throw new Error(data.message || 'Face verification failed.');
                }

            } catch (err) {
                // Handle Error
                isProcessing = false;
                showStatus(err.message, 'error');
                captureBtn.innerHTML = '<i class="fa-solid fa-camera"></i> Scan & Verify Face';
                captureBtn.style.display = 'none';
                retryBtn.style.display = 'flex';
            }
        }

        function showStatus(message, type) {
            const el = document.getElementById('statusMessage');
            el.textContent = message;
            el.className = `status-message status-${type}`;
            el.style.display = 'block';
        }

        function resetUI() {
            isProcessing = false;
            document.getElementById('statusMessage').style.display = 'none';
            document.getElementById('retryBtn').style.display = 'none';
            
            const captureBtn = document.getElementById('captureBtn');
            captureBtn.style.display = 'flex';
            captureBtn.disabled = false;
            captureBtn.innerHTML = '<i class="fa-solid fa-camera"></i> Scan & Verify Face';
            
            video.play();
        }
    </script>
</body>
</html>
