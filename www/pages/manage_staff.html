<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Manage Staff - FaceAttend</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="../js/back-button-native.js"></script>
    <script src="../js/route-persistence.js"></script>
    <script src="../js/location-tracking-plugin.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/session-persistence.js" defer></script>
    <script src="../js/main.js" defer></script>
    <script src="../js/manage_staff.js" defer></script>
</head>
<body class="dashboard-body">
    <nav class="navbar">
        <a href="admin_dashboard.html" class="navbar-brand">
            <div class="logo-icon">
                <img src="../assets/Bits-logo.png" alt="BITS Logo">
            </div>
        </a>

        <div class="mobile-nav-actions">
            <a href="faculty_approvals.html" class="notification-bell" id="facultyApprovalsBell" aria-label="Faculty approvals">
                <i class="fa-solid fa-bell"></i>
                <span id="pendingApprovalBadge">0</span>
            </a>
            <button class="menu-toggle" aria-label="Toggle navigation"><i class="fa-solid fa-bars"></i></button>
        </div>

        <div class="nav-menu">
            <ul class="navbar-nav">
                <li><a href="admin_dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="holidays.html" class="nav-link">Holidays</a></li>
            </ul>
            <div class="nav-actions">
                <a href="../index.html" class="action-btn-danger" onclick="localStorage.removeItem('user'); localStorage.removeItem('user_role'); localStorage.removeItem('user_id'); localStorage.removeItem('user_name');">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </a>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="dashboard-header" style="flex-direction: column; align-items: flex-start; gap: 1.5rem;">
            <div>
                <h2 style="font-size: 2rem; color: #0f172a; margin: 0 0 0.25rem 0; letter-spacing: -0.02em;">Staff Directory</h2>
                <p style="color: #64748b; margin: 0; font-size: 0.95rem;">View staff records with cleaner alignment and faster actions.</p>
            </div>

            <div style="position: relative; width: 100%; max-width: 340px;">
                <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 0.9rem;"></i>
                <input type="text" id="searchStaff" class="modern-input" placeholder="Search by name, ID, or role..." style="padding-left: 2.5rem; border-radius: 50px;">
            </div>
        </div>

        <div class="glass-card" style="padding: 0; overflow: hidden; border: 1.5px solid #e2e8f0;">
            <div style="padding: 1.5rem; background: linear-gradient(135deg, #ffffff 0%, #f9fafb 100%); border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                <div>
                    <h3 style="margin: 0; font-size: 1.1rem; color: #0f172a; font-weight: 700;">Active Directory</h3>
                    <p style="margin: 0.35rem 0 0 0; color: #64748b; font-size: 0.85rem;">Staff ID, role, current attendance status, and quick controls.</p>
                </div>
            </div>

            <div class="table-responsive staff-table-shell">
                <table class="premium-table staff-directory-table">
                    <colgroup>
                        <col class="staff-col-id">
                        <col class="staff-col-name">
                        <col class="staff-col-role">
                        <col class="staff-col-status">
                        <col class="staff-col-actions">
                    </colgroup>
                    <thead>
                        <tr style="background: linear-gradient(135deg, #f8fafc 0%, #f3f4f6 100%); border-bottom: 2px solid #e2e8f0;">
                            <th>Staff ID</th>
                            <th>Name</th>
                            <th>Role</th>
                            <th class="staff-status-head">Status</th>
                            <th class="staff-actions-head">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="staffTableBody">
                        <tr>
                            <td colspan="5" style="text-align: center; padding: 2rem; color: #64748b;">Loading staff records...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div style="text-align: center; padding: 1.25rem; border-top: 1px solid #e2e8f0; background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);">
                <button class="action-btn-secondary" type="button" style="border-radius: 50px; padding: 0.6rem 1.5rem; font-size: 0.9rem; border: 2px solid #e2e8f0;">
                    <i class="fa-solid fa-chevron-down" style="margin-right: 0.5rem; font-size: 0.8rem;"></i> Directory synced live
                </button>
            </div>
        </div>
    </div>

    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const navMenu = document.querySelector('.nav-menu');

        if (menuToggle && navMenu) {
            menuToggle.addEventListener('click', () => {
                navMenu.classList.toggle('active');
                const icon = menuToggle.querySelector('i');
                if (navMenu.classList.contains('active')) {
                    icon.classList.remove('fa-bars');
                    icon.classList.add('fa-times');
                } else {
                    icon.classList.remove('fa-times');
                    icon.classList.add('fa-bars');
                }
            });
        }
    </script>
</body>
</html>
